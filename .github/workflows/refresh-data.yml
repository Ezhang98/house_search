name: Refresh map data

# Manual only. These datasets change on scales from hours (active fire
# perimeters) to years (FEMA flood maps), and every run rewrites ~100 MB of
# GeoJSON into git history -- so refreshing is a decision, not a cron job.
on:
  workflow_dispatch:
    inputs:
      layers:
        description: 'Comma-separated layer ids, or "all"'
        required: true
        default: 'all'
      prices:
        description: 'Also refresh Redfin sold prices (downloads ~1.5 GB)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild hazard and infrastructure layers
        run: |
          if [ "${{ inputs.layers }}" = "all" ]; then
            python data/build_layers.py
          else
            python data/build_layers.py --only "${{ inputs.layers }}"
          fi

      - name: Refresh sold prices
        if: ${{ inputs.prices }}
        run: python data/update_prices.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No data changed; nothing to commit."
          else
            git commit -m "Refresh map data (${{ inputs.layers }})"
            git push
          fi
